name: Ensayo del despliegue

# 002-produccion — el despliegue entero, en una máquina desechable, sin servidor
# y sin una sola credencial.
#
# ─────────────────────────────────────────────────────────────────────────────
# LO QUE SE MIDIÓ, Y POR QUÉ ESTE FICHERO EXISTE (2026-10-15)
#
# `deploy.yml` corrió en master 4 de 4 veces con TODOS sus pasos `skipped`: no
# hay servidor ni secretos, y eso es correcto. Pero quiere decir que el stack de
# producción —`compose.prod.yml`, el portero, `deploy-remoto.sh`,
# `importar-schema.sh`, el respaldo y la restauración— NO SE HA LEVANTADO NUNCA.
# Ningún workflow lo corría y la máquina donde se escribe no tiene Docker.
#
# Y tenía defectos esperando al primer servidor: el `.env` que deja
# `bootstrap-servidor.sh` no traía dos de las cinco variables que el compose
# exige con `:?`, así que el primer `compose pull` habría muerto. Eso no lo ve un
# gate de texto que mire cada fichero por separado; lo ve correr los ficheros
# JUNTOS, que es lo que hace esto.
#
# EL RUNNER HACE DE SERVIDOR, Y LA FIDELIDAD ES LA REGLA:
#
#   · `/opt/synergos` con lo que copia `deploy.yml` — la lista se EXTRAE de su
#     `scp`, no se repite acá: una segunda lista se desincroniza el día que
#     nadie mira, que es como el despliegue dejó dos veces scripts sin copiar.
#   · el `.env` es el que deja `bootstrap-servidor.sh --solo-env`, más lo único
#     que el arquitecto pone a mano: el dominio.
#   · los MISMOS scripts, en el orden de la guía; el humo es `humo-publico.sh`,
#     el mismo que corre el despliegue contra el dominio de verdad.
#   · desde 2026-11-01 (salida a Hetzner), `deploy-remoto.sh` hace el levantado
#     entero —piezas, uSync y siembra— y esto prueba las dos promesas: un servidor
#     NUEVO queda verde sin un solo paso a mano, y un despliegue SIGUIENTE no toca
#     lo que cambió un editor (con su contraprueba: un import con contenido sí lo
#     revierte, así que la sonda no mira el vacío).
#   · el dominio es `localhost`: Caddy le firma el certificado con su CA local
#     y el humo confía en ella por `CURL_CA_BUNDLE`, sin tocar el script (que no
#     puede decir `localhost`: lo vigila DeployPipelineTests).
#
# Las imágenes son las de GHCR — las mismas que bajaría el servidor— de un
# commit de MASTER: sólo ahí se publican. En una rama, el ensayo usa el commit
# de master en que se basa; lo que se ensaya entonces son los FICHEROS del
# despliegue de la rama contra las imágenes publicadas, que es lo que una rama
# de despliegue cambia.
# ─────────────────────────────────────────────────────────────────────────────

on:
  # Después de cada publicación de imágenes en master, como el despliegue.
  workflow_run:
    workflows: ["Imágenes (GHCR)"]
    types: [completed]
    branches: [main, master]

  workflow_dispatch:
    inputs:
      sha:
        description: "Commit de master cuyas imágenes se ensayan (vacío = el de este ref o su base en master)"
        required: false

  # En una rama, sólo si toca una pieza del despliegue: lo que se ensaya son
  # esos ficheros. Master lo cubre el `workflow_run` de arriba.
  push:
    branches-ignore: [main, master]
    paths:
      - compose.prod.yml
      - Caddyfile
      - Dockerfile
      - .dockerignore
      - tools/deploy-remoto.sh
      - tools/importar-schema.sh
      - tools/respaldo.sh
      - tools/enviar-respaldo.sh
      - tools/restaurar.sh
      - tools/provisionar.sh
      - tools/provisionar-en-la-red.sh
      - tools/provisionar.*.json
      - tools/humo-publico.sh
      - tools/bootstrap-servidor.sh
      - .github/workflows/deploy.yml
      - .github/workflows/ensayo-despliegue.yml

concurrency:
  group: ensayo-despliegue-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ensayo:
    # ⚠️ El nombre NO puede empezar por «Poner en pie»: `deploy.yml` excluye ese
    # prefijo de su puerta (es el suyo, para no esperarse a sí mismo), y con él
    # el despliegue de producción no esperaba a este ensayo del mismo commit.
    # Hoy lo espera, y no despliega si el ensayo salió rojo (SalidaAProduccionTests).
    name: El despliegue entero, ensayado

    # Si las imágenes fallaron no hay nada que ensayar: el despliegue tampoco correría.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      SYNERGOS_DIR: /opt/synergos
      REGISTRO: ghcr.io/cherced-dev

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      # ── 0. Qué imágenes se ensayan, y a cuál se vuelve ──────────────────
      #
      # Las imágenes se publican por push a master, no por commit: un commit
      # intermedio no tiene. Se busca hacia atrás por la historia de master el
      # primero que sí, y después el ANTERIOR con imágenes — el destino de la
      # vuelta atrás, como `tag.actual` en el servidor.
      - id: etiquetas
        name: Qué se ensaya
        env:
          EVENTO: ${{ github.event_name }}
          PEDIDO: ${{ github.event.inputs.sha }}
        run: |
          set -euo pipefail
          tiene_imagenes() { docker manifest inspect "$REGISTRO/synergos-cms:$1" >/dev/null 2>&1; }

          git fetch --quiet origin master
          case "$EVENTO" in
            workflow_dispatch) DESDE="${PEDIDO:-$(git merge-base HEAD origin/master)}" ;;
            workflow_run)      DESDE="$(git rev-parse HEAD)" ;;
            *)                 DESDE="$(git merge-base HEAD origin/master)" ;;
          esac

          SHA=""; ANTERIOR=""
          for c in $(git rev-list --first-parent --max-count=40 "$DESDE"); do
            if tiene_imagenes "$c"; then
              if [ -z "$SHA" ]; then SHA="$c"; else ANTERIOR="$c"; break; fi
            fi
          done
          [ -n "$SHA" ] || { echo "✗ ningún commit de master desde $DESDE tiene imágenes en GHCR"; exit 1; }
          [ -n "$ANTERIOR" ] || { echo "✗ no hay una versión anterior con imágenes: no se puede ensayar la vuelta atrás"; exit 1; }

          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "anterior=$ANTERIOR" >> "$GITHUB_OUTPUT"
          {
            echo "### Ensayo del despliegue"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| ficheros del despliegue | \`$(git rev-parse --short HEAD)\` ($EVENTO) |"
            echo "| imágenes que se ponen | \`${SHA:0:7}\` |"
            echo "| versión a la que se vuelve | \`${ANTERIOR:0:7}\` |"
            echo
            echo "| paso | resultado | tiempo |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

      # Dos juegos de 26 imágenes no caben cómodos en el disco por defecto del
      # runner: se quita lo que este job no usa.
      - name: Liberar disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h / | tail -1

      # ── 1. El «servidor» ────────────────────────────────────────────────
      - name: Preparar /opt/synergos como lo deja el despliegue
        env:
          ANTERIOR: ${{ steps.etiquetas.outputs.anterior }}
        run: |
          set -euo pipefail
          sudo install -d -o "$USER" -g "$USER" -m 755 "$SYNERGOS_DIR"

          # La lista del `scp` de deploy.yml, extraída de él: desde la línea del
          # `scp` hasta el destino en el servidor, sin las barras de continuación.
          LISTA="$(awk '/scp -i ~\/\.ssh\/id_deploy/ {dentro=1; next}
                        dentro && /USUARIO@\$HOST:\/opt\/synergos\// {dentro=0}
                        dentro {print}' .github/workflows/deploy.yml | tr -d '\\' | xargs)"
          case " $LISTA " in
            *" compose.prod.yml "*" tools/deploy-remoto.sh "*) ;;
            *) echo "✗ no se pudo extraer la lista que copia deploy.yml (salió: '$LISTA')"; exit 1 ;;
          esac
          echo "copia: $LISTA"
          # shellcheck disable=SC2086
          cp $LISTA "$SYNERGOS_DIR/"
          chmod +x "$SYNERGOS_DIR"/*.sh

          # El servidor de verdad tuvo en pie la versión anterior, y `deploy-remoto.sh`
          # le guardó los ficheros con que la puso —los del commit de ESA versión—:
          # el destino de la vuelta atrás. Se ponen los mismos, sacados de la historia.
          install -d "$SYNERGOS_DIR/versiones/$ANTERIOR"
          git show "$ANTERIOR:compose.prod.yml" > "$SYNERGOS_DIR/versiones/$ANTERIOR/compose.prod.yml"
          git show "$ANTERIOR:Caddyfile" > "$SYNERGOS_DIR/versiones/$ANTERIOR/Caddyfile"
          echo "| ficheros de \`${ANTERIOR:0:7}\` guardados, como en el servidor que la tuvo en pie | ✓ | — |" >> "$GITHUB_STEP_SUMMARY"

          # El `.env` que deja la preparación del servidor, más el dominio.
          bash tools/bootstrap-servidor.sh --solo-env "$SYNERGOS_DIR/.env"
          sed -i 's/^SYNERGOS_DOMAIN=.*/SYNERGOS_DOMAIN=localhost/' "$SYNERGOS_DIR/.env"
          echo "| \`.env\` del bootstrap + dominio | ✓ | — |" >> "$GITHUB_STEP_SUMMARY"

      # ── 2. Una obligatoria que falta para ANTES de tocar nada (FR-006) ───
      - name: Sin una obligatoria, el despliegue se niega antes de parar nada
        working-directory: /opt/synergos
        env:
          SHA: ${{ steps.etiquetas.outputs.sha }}
        run: |
          set -uo pipefail
          cp .env .env.completo
          grep -v '^SYNERGOS_ADMIN_PASSWORD=' .env.completo > .env
          # El shell de GitHub es `bash -e`: sin el `||`, el 3 cortaría el paso acá.
          CODIGO=0
          ./deploy-remoto.sh "$SHA" > /tmp/negativo.log 2>&1 || CODIGO=$?
          [ "$CODIGO" != 0 ] || { cat /tmp/negativo.log; echo "✗ desplegó con una obligatoria vacía"; exit 1; }
          grep -q 'SYNERGOS_ADMIN_PASSWORD' /tmp/negativo.log || { cat /tmp/negativo.log; echo "✗ falló sin nombrar la variable"; exit 1; }
          [ -z "$(docker ps -q)" ] || { docker ps; echo "✗ arrancó contenedores"; exit 1; }
          # 3 = «no se tocó nada»: deploy.yml no hace la vuelta atrás por esto.
          [ "$CODIGO" = 3 ] || { cat /tmp/negativo.log; echo "✗ salió $CODIGO y no 3: deploy.yml lo tomaría por un fallo con el stack tocado"; exit 1; }
          mv .env.completo .env
          echo "| sin \`SYNERGOS_ADMIN_PASSWORD\`: se niega nombrándola, sale 3, 0 contenedores | ✓ | — |" >> "$GITHUB_STEP_SUMMARY"

      # ── 3. Un servidor NUEVO, levantado entero por el despliegue ─────────
      #
      # Sin `importar-schema.sh` ni `provisionar-en-la-red.sh` a mano: los corre
      # `deploy-remoto.sh`. Que la base se reconozca nueva y quede marcada lo dice
      # su salida; que no quede nada por sembrar, `--verificar` desde fuera.
      - name: Servidor nuevo — deploy-remoto.sh lo levanta entero
        working-directory: /opt/synergos
        env:
          SHA: ${{ steps.etiquetas.outputs.sha }}
        run: |
          set -euo pipefail
          t=$SECONDS
          ./deploy-remoto.sh "$SHA" 2>&1 | tee /tmp/despliegue-1.log
          grep -q 'base nueva (sin marca y sin documentos)' /tmp/despliegue-1.log \
            || { echo "✗ el primer despliegue no reconoció la base nueva"; exit 1; }
          grep -q 'marca del contenido: importado' /tmp/despliegue-1.log \
            || { echo "✗ el contenido no quedó marcado como importado"; exit 1; }
          ./provisionar-en-la-red.sh --verificar
          echo "| servidor nuevo: \`deploy-remoto.sh\` pone las piezas en \`${SHA:0:7}\`, importa schema y contenido y siembra; \`--verificar\` en verde | ✓ | $((SECONDS - t)) s |" >> "$GITHUB_STEP_SUMMARY"

      # En una RAMA, la imagen del CMS se construye de la rama: el `Dockerfile` y el
      # `.dockerignore` son piezas del despliegue, y una imagen de master no ensaya
      # lo que la rama cambia en ellos (medido: la de master no lleva la vitrina).
      # Lleva la MISMA etiqueta y la misma versión, así que el humo la reconoce; y
      # `compose up` recrea el CMS con ella sin tocar el volumen de medios.
      #
      # ⚠️ Desde 2026-11-01 llega DESPUÉS del import: lo hace `deploy-remoto.sh`, que
      # baja de GHCR la imagen de master y la usa para importar. La de la rama sirve
      # el humo y el navegador de abajo; el despliegue siguiente vuelve a bajar la de
      # master. Una rama que cambie lo que la imagen IMPORTA se ensaya en master.
      - name: En una rama, la imagen del CMS sale de la rama
        if: github.event_name == 'push'
        env:
          SHA: ${{ steps.etiquetas.outputs.sha }}
        run: |
          set -euo pipefail
          t=$SECONDS
          docker build --quiet --build-arg VERSION="$SHA" --tag "$REGISTRO/synergos-cms:$SHA" .
          cd /opt/synergos
          SYNERGOS_TAG="$SHA" docker compose --file compose.prod.yml --project-directory . up --detach cms
          for i in $(seq 1 60); do
            [ "$(docker inspect --format '{{.State.Health.Status}}' "$(SYNERGOS_TAG="$SHA" docker compose --file compose.prod.yml --project-directory . ps --quiet cms)")" = healthy ] && break
            [ "$i" -eq 60 ] && { echo "✗ el CMS de la rama no quedó sano"; exit 1; }
            sleep 5
          done
          echo "| imagen del CMS construida de la rama | ✓ | $((SECONDS - t)) s |" >> "$GITHUB_STEP_SUMMARY"

      # Lo que sirve el CMS justo después del import, directo y sin el portero.
      # Medido en la corrida 4: tras un import de 1240 ítems sin errores, la
      # portada seguía siendo el cartel vacío. Esto dice si es la caché de
      # contenido (que un reinicio arreglaría) o el import.
      - name: Tras el import, qué sirve el CMS
        if: always() && steps.etiquetas.outputs.sha != ''
        working-directory: /opt/synergos
        run: |
          set -uo pipefail
          C="docker compose --file compose.prod.yml --project-directory ."
          export SYNERGOS_TAG="$(cat tag.actual 2>/dev/null || true)"
          portada() {
            docker run --rm --network synergos_interna curlimages/curl:8.10.1 -s -o /tmp/p.html -w '%{http_code} %{size_download} B\n' http://cms:8080/ 2>/dev/null \
              || docker run --rm --network synergos_interna curlimages/curl:8.10.1 -s -w '%{http_code}\n' -o /dev/null http://cms:8080/
            docker run --rm --network synergos_interna curlimages/curl:8.10.1 -s http://cms:8080/ | grep -o '<title>[^<]*' | head -1
          }
          echo "── portada, directa al CMS:"; portada
          echo "── lo que hay en la base (documentos, publicados, caché de contenido, idiomas):"
          docker run --rm -v synergos_cms-db:/d:ro alpine:3 sh -c \
            'apk add --no-cache --quiet sqlite >/dev/null 2>&1; sqlite3 /d/Umbraco.sqlite.db \
             "select '\''documentos'\'', count(*) from umbracoDocument;
              select '\''publicados'\'', count(*) from umbracoDocument where published = 1;
              select '\''contentNu'\'', count(*) from cmsContentNu;
              select '\''idioma'\'', languageISOCode, isDefaultVariantLang from umbracoLanguage;
              select '\''raiz'\'', n.text, d.published from umbracoNode n join umbracoDocument d on d.nodeId = n.id where n.level = 1;"' || true
          echo "── la caché en disco:"
          $C exec -T cms sh -c 'ls -la /app/umbraco/Data/TEMP/NuCache /app/umbraco/Data/TEMP/DistCache 2>&1 | head -20' || true
          echo "── el log del CMS sobre la caché:"
          $C logs cms 2>&1 | grep -iE 'nucache|cold boot|lastsynced|instruction|maindom|rebuil|published content|content cache' | tail -25 || true
          echo "── un reinicio, para ver si lo arregla:"
          $C restart cms >/dev/null
          for i in $(seq 1 60); do
            [ "$(docker inspect --format '{{.State.Health.Status}}' "$($C ps --quiet cms)")" = healthy ] && break
            sleep 5
          done
          portada || true

      # La CA local de Caddy cambia si se borra su volumen (paso 5), así que se
      # vuelve a leer antes de cada humo.
      - name: Humo público (1)
        env:
          SHA: ${{ steps.etiquetas.outputs.sha }}
        run: |
          set -euo pipefail
          docker compose --file /opt/synergos/compose.prod.yml --project-directory /opt/synergos \
            cp proxy:/data/caddy/pki/authorities/local/root.crt /tmp/ca-del-ensayo.crt
          CURL_CA_BUNDLE=/tmp/ca-del-ensayo.crt ./tools/humo-publico.sh localhost "$SHA"
          echo "| humo público tras el import | ✓ | — |" >> "$GITHUB_STEP_SUMMARY"

      # ── 3.bis. Con navegador: las cabeceras no rompen nada ──────────────
      #
      # El humo comprueba que las cabeceras ESTÁN; esto, que no rompen lo que
      # carga un navegador: `nosniff` rechaza un script servido con otro tipo, y
      # `frame-ancestors`/`X-Frame-Options` cortan un marco. Se cargan la portada y
      # el backoffice y se falla con cualquier aviso de esa familia en la consola.
      - name: Con navegador, la portada y el backoffice bajo las cabeceras
        run: |
          set -euo pipefail
          mkdir -p /tmp/navegador && cd /tmp/navegador
          npm init -y >/dev/null
          npm install --silent --no-audit --no-fund playwright@1.48.2 >/dev/null
          npx --yes playwright@1.48.2 install --with-deps chromium >/dev/null
          cat > ver.mjs <<'JS'
          import { chromium } from 'playwright';
          const navegador = await chromium.launch();
          const pagina = await navegador.newPage({ ignoreHTTPSErrors: true });
          const avisos = [];
          pagina.on('console', (m) => {
            const t = m.text();
            if (/Content Security Policy|Refused to|frame-ancestors|X-Frame-Options|MIME type/i.test(t)) avisos.push(t);
          });
          for (const ruta of ['/', '/umbraco']) {
            const r = await pagina.goto('https://localhost' + ruta, { waitUntil: 'load', timeout: 90000 });
            await pagina.waitForTimeout(3000);
            console.log(`${ruta} → ${r.status()} «${await pagina.title()}»`);
            if (!r.ok()) { console.error(`✗ ${ruta} contestó ${r.status()}`); process.exit(1); }
          }
          await navegador.close();
          if (avisos.length) { console.error('✗ el navegador avisa por las cabeceras:\n  ' + avisos.join('\n  ')); process.exit(1); }
          console.log('✓ la portada y el backoffice cargan con las cabeceras, sin avisos de CSP, marcos ni MIME');
          JS
          node ver.mjs
          echo "| navegador: portada y backoffice sin avisos por las cabeceras | ✓ | — |" >> "$GITHUB_STEP_SUMMARY"

      # ── 3.ter. El producto el primer día, como lo ve un visitante ───────
      #
      # MEDIDA, no puerta (002, 2026-11-01): qué contesta cada vertical en un servidor
      # recién levantado, sin cuentas y con el `.env` del bootstrap. Es lo que decide qué
      # le queda por hacer al arquitecto (F1.bis, P6) y lo que ya funciona sin manos.
      - name: El primer día, lo que ve un visitante (medida)
        if: always() && steps.etiquetas.outputs.sha != ''
        run: |
          set -uo pipefail
          export CURL_CA_BUNDLE=/tmp/ca-del-ensayo.crt
          echo "| ruta | código | qué trae |" > /tmp/primer-dia.md
          echo "|---|---|---|" >> /tmp/primer-dia.md
          for ruta in /api/ehr/doctors /api/ehr/copay /api/eventos/events /api/shop/search /api/academy/courses \
                      /api/realty/listings /api/alquiler/equipment /api/gov/services; do
            codigo="$(curl -s -o /tmp/r.json -w '%{http_code}' "https://localhost$ruta" || echo 000)"
            que="$(jq -r 'if type=="array" then "\(length) elementos"
                          else ([to_entries[] | select(.value|type=="array") | "\(.key): \(.value|length)"]
                                + [to_entries[] | select(.value|type=="number") | "\(.key)=\(.value)"]) | join(", ") end' /tmp/r.json 2>/dev/null || head -c 120 /tmp/r.json)"
            echo "| \`$ruta\` | $codigo | ${que:-—} |" | tee -a /tmp/primer-dia.md
          done
          { echo; echo "**El primer día, sin cuentas** (medida):"; echo; cat /tmp/primer-dia.md; echo; } >> "$GITHUB_STEP_SUMMARY"

      # ── 4. Un editor cambia una página ──────────────────────────────────
      #
      # Lo que un despliegue SIGUIENTE no puede revertir. Se cambia en la base, con
      # el CMS parado, el `heading` vigente de un documento que vino del contenido
      # versionado —uSync lo compara con su XML al importar, así que un import con
      # contenido lo devolvería al del repo (la contraprueba, abajo)—. El CMS lo
      # vuelve a arrancar el respaldo, que es lo siguiente.
      - name: Un editor cambia una página
        working-directory: /opt/synergos
        run: |
          set -euo pipefail
          cat > /tmp/sonda.py <<'PY'
          import sqlite3, sys, uuid
          MARCA = ' — editado en el ensayo'
          con = sqlite3.connect('/datos/Umbraco.sqlite.db')
          VIGENTE = '''from umbracoPropertyData pd
                       join cmsPropertyType pt on pt.id = pd.propertyTypeId
                       join umbracoContentVersion cv on cv.id = pd.versionId
                       join umbracoDocument d on d.nodeId = cv.nodeId
                       where pt.Alias = 'heading' and cv."current" = 1'''
          if sys.argv[1] == 'editar':
              fila = con.execute('select pd.id, cv.nodeId, coalesce(pd.varcharValue, pd.textValue) ' + VIGENTE +
                                 " and coalesce(pd.varcharValue, pd.textValue, '') <> '' order by cv.nodeId, pd.id limit 1").fetchone()
              if fila is None:
                  sys.exit('✗ no hay ningún heading con valor en la base: la sonda no tiene qué editar')
              con.execute('update umbracoPropertyData set varcharValue = varcharValue || ?, textValue = textValue || ? where id = ?',
                          (MARCA, MARCA, fila[0]))
              con.commit()
              print(f'nodo {fila[1]}: «{fila[2]}» → «{fila[2]}{MARCA}»')
          elif sys.argv[1] == 'llegan':
              # Lo que llega al repo DESPUÉS del primer despliegue (P10): un documento y una media que
              # la base no tiene. Se consigue cambiándoles la clave en la base —uSync busca por clave—,
              # así que para él son exactamente un nodo nuevo del repo. Hojas, para no huérfanos.
              DOC, MEDIA = 'C66BA18E-EAF3-4CFF-8A22-41B16D66A972', 'B796F64C-1F99-4FFB-B886-4BF4BC011A9C'
              hoja = '''select n.id, n.uniqueId from umbracoNode n join umbracoContent c on c.nodeId = n.id
                        join cmsContentType ct on ct.nodeId = c.contentTypeId
                        where upper(n.nodeObjectType) = ? and n.trashed = 0 and ct.alias <> 'Folder'
                        and not exists (select 1 from umbracoNode h where h.parentId = n.id) order by n.id desc limit 1'''
              claves = []
              for tipo in (DOC, MEDIA):
                  nid, clave = con.execute(hoja, (tipo,)).fetchone()
                  nueva = str(uuid.uuid4())
                  con.execute('update umbracoNode set uniqueId = ? where id = ?', (nueva.upper() if clave.isupper() else nueva, nid))
                  claves.append(clave)
              con.commit()
              print(' '.join(claves))
          elif sys.argv[1] == 'llegaron':
              cuenta = lambda clave: con.execute('select count(*) from umbracoNode where lower(uniqueId) = lower(?)', (clave,)).fetchone()[0]
              print(cuenta(sys.argv[2]), cuenta(sys.argv[3]), con.execute('select count(*) from umbracoContentVersion').fetchone()[0])
          else:
              print(con.execute("select count(*) " + VIGENTE +
                                " and coalesce(pd.varcharValue, pd.textValue) like ?", ('%' + MARCA,)).fetchone()[0])
          con.close()
          PY
          docker compose --file compose.prod.yml --project-directory . stop cms >/dev/null
          docker run --rm -v synergos_cms-db:/datos -v /tmp/sonda.py:/sonda.py:ro python:3.12-alpine python3 /sonda.py editar
          docker run --rm -v synergos_cms-db:/datos -v /tmp/sonda.py:/sonda.py:ro python:3.12-alpine python3 /sonda.py llegan > /tmp/llegan.txt
          echo "lo que «llega» después del primer despliegue (documento y media): $(cat /tmp/llegan.txt)"
          echo "| un editor cambia un \`heading\` vigente; y llegan al repo un documento y una media que la base no tiene | ✓ | — |" >> "$GITHUB_STEP_SUMMARY"

      # ── 5. Respaldo, pérdida y restauración ─────────────────────────────
      - name: respaldo.sh
        working-directory: /opt/synergos
        run: |
          set -euo pipefail
          t=$SECONDS
          ./respaldo.sh /tmp/respaldos
          ls -la /tmp/respaldos
          echo "| respaldo (\`respaldo.sh\`) | ✓ | $((SECONDS - t)) s |" >> "$GITHUB_STEP_SUMMARY"

      # El ÚNICO `--volumes` de este fichero, y es a propósito: simula perder el
      # disco. Si la restauración no devuelve la base del CMS, Umbraco arranca
      # VACÍO y el humo lo ve (el cartel «No published content»).
      #
      # Y es el SEGUNDO DESPLIEGUE: `deploy-remoto.sh` importa otra vez, y tiene que
      # ser el schema y sólo lo nuevo del contenido —la marca vino en el respaldo con la
      # base—: dejar en pie lo que cambió el editor y crear el documento y la media que
      # «llegaron» al repo (P10). Repetido, no cambia nada. Lo mismo vale para un
      # despliegue sin restaurar: la marca se lee del volumen igual; acá además se
      # prueba que viaja con él.
      - name: Perder los volúmenes, restaurarlos y desplegar otra vez
        working-directory: /opt/synergos
        env:
          SHA: ${{ steps.etiquetas.outputs.sha }}
        run: |
          set -euo pipefail
          t=$SECONDS
          docker compose --file compose.prod.yml --project-directory . down --volumes
          ARCHIVO="$(ls -t /tmp/respaldos/*.tar.gz | head -1)"
          ./restaurar.sh "$ARCHIVO" --si-estoy-seguro
          ./deploy-remoto.sh "$SHA" 2>&1 | tee /tmp/despliegue-2.log
          grep -q 'la base ya tiene su contenido' /tmp/despliegue-2.log \
            || { echo "✗ el segundo despliegue no leyó la marca de la base restaurada"; exit 1; }
          docker run --rm -v synergos_cms-db:/datos:ro alpine:3 cat /datos/synergos-contenido-versionado | grep -q '^importado ' \
            || { echo "✗ la marca de la base restaurada no dice «importado»"; exit 1; }
          grep -q 'SÓLO LO NUEVO del contenido' /tmp/despliegue-2.log \
            || { echo "✗ el segundo despliegue no importó el contenido en «sólo lo nuevo»"; exit 1; }
          SONDA="docker run --rm -v synergos_cms-db:/datos -v /tmp/sonda.py:/sonda.py:ro python:3.12-alpine python3 /sonda.py"
          EDITADOS="$($SONDA contar)"
          [ "$EDITADOS" -ge 1 ] || { echo "✗ el segundo despliegue revirtió lo que cambió el editor"; exit 1; }
          read -r DOC MEDIA < /tmp/llegan.txt
          read -r HAY_DOC HAY_MEDIA VERSIONES <<< "$($SONDA llegaron "$DOC" "$MEDIA")"
          [ "$HAY_DOC" = 1 ] && [ "$HAY_MEDIA" = 1 ] \
            || { echo "✗ lo nuevo del repo no entró (documento: $HAY_DOC, media: $HAY_MEDIA)"; exit 1; }
          echo "| volúmenes borrados → \`restaurar.sh\` → segundo despliegue: lo del editor sigue ($EDITADOS) y entran el documento y la media nuevos | ✓ | $((SECONDS - t)) s |" >> "$GITHUB_STEP_SUMMARY"

          # Y otra vez lo mismo: nada nuevo que crear, así que ni una versión más y la edición intacta.
          ./importar-schema.sh --contenido-la-primera-vez > /tmp/despliegue-2b.log 2>&1 || { cat /tmp/despliegue-2b.log; exit 1; }
          read -r _ _ VERSIONES_2 <<< "$($SONDA llegaron "$DOC" "$MEDIA")"
          [ "$VERSIONES_2" = "$VERSIONES" ] && [ "$($SONDA contar)" -ge 1 ] \
            || { echo "✗ repetir el import cambió el contenido ($VERSIONES → $VERSIONES_2 versiones)"; exit 1; }
          echo "| repetir el import: $VERSIONES versiones antes y después, la edición sigue | ✓ | — |" >> "$GITHUB_STEP_SUMMARY"

      - name: Humo público (2) — sin reimportar el contenido
        env:
          SHA: ${{ steps.etiquetas.outputs.sha }}
        run: |
          set -euo pipefail
          docker compose --file /opt/synergos/compose.prod.yml --project-directory /opt/synergos \
            cp proxy:/data/caddy/pki/authorities/local/root.crt /tmp/ca-del-ensayo.crt
          CURL_CA_BUNDLE=/tmp/ca-del-ensayo.crt ./tools/humo-publico.sh localhost "$SHA"
          echo "| humo tras restaurar y redesplegar: la base volvió | ✓ | — |" >> "$GITHUB_STEP_SUMMARY"

      # La contraprueba: un import CON contenido sí devuelve la página al XML del
      # repo. Sin ella, «lo del editor sigue» podría ser una sonda que uSync no mira.
      - name: Contraprueba — un import con contenido sí lo revierte
        working-directory: /opt/synergos
        run: |
          set -euo pipefail
          t=$SECONDS
          ./importar-schema.sh --con-contenido
          EDITADOS="$(docker run --rm -v synergos_cms-db:/datos -v /tmp/sonda.py:/sonda.py:ro python:3.12-alpine python3 /sonda.py contar)"
          [ "$EDITADOS" = "0" ] || { echo "✗ un import con contenido NO revirtió la edición: la sonda no prueba nada"; exit 1; }
          echo "| contraprueba: \`importar-schema.sh --con-contenido\` sí revierte la edición | ✓ | $((SECONDS - t)) s |" >> "$GITHUB_STEP_SUMMARY"

      # ── 6. Volver a la versión anterior, como hace deploy.yml si el humo falla
      - name: Vuelta atrás
        working-directory: /opt/synergos
        env:
          ANTERIOR: ${{ steps.etiquetas.outputs.anterior }}
          SHA: ${{ steps.etiquetas.outputs.sha }}
        run: |
          set -euo pipefail
          t=$SECONDS
          ./deploy-remoto.sh "$ANTERIOR" 2>&1 | tee /tmp/vuelta.log
          # Una vuelta no importa el schema de antes encima del de ahora ni siembra.
          grep -q 'es una vuelta atrás, así que ni se importa' /tmp/vuelta.log \
            || { echo "✗ la vuelta atrás importó o sembró: el schema anterior podría quitar lo que añadió la nueva"; exit 1; }
          if grep -q 'importando el schema' /tmp/vuelta.log; then echo "✗ la vuelta atrás corrió un import"; exit 1; fi
          # Lo que la versión nueva traía y la anterior no (la primera vez,
          # `bff-reservas`) no puede quedar corriendo: sería una pieza de otra
          # versión en pie, y la comprobación de etiquetas del script no la ve
          # porque ya no es de su compose.
          NUEVAS="$(docker ps --format '{{.Names}} {{.Image}}' | grep -F ":$SHA" || true)"
          if [ -n "$NUEVAS" ]; then
            echo "✗ tras volver siguen corriendo piezas de ${SHA:0:7}:"
            echo "$NUEVAS"
            exit 1
          fi
          echo "| vuelta a \`${ANTERIOR:0:7}\` sin importar ni sembrar, y sin nada de \`${SHA:0:7}\` corriendo | ✓ | $((SECONDS - t)) s |" >> "$GITHUB_STEP_SUMMARY"

      - name: Humo público (3) — la versión anterior
        env:
          ANTERIOR: ${{ steps.etiquetas.outputs.anterior }}
        run: |
          set -euo pipefail
          docker compose --file /opt/synergos/compose.prod.yml --project-directory /opt/synergos \
            cp proxy:/data/caddy/pki/authorities/local/root.crt /tmp/ca-del-ensayo.crt
          CURL_CA_BUNDLE=/tmp/ca-del-ensayo.crt ./tools/humo-publico.sh localhost "$ANTERIOR"
          echo "| humo con la versión anterior | ✓ | — |" >> "$GITHUB_STEP_SUMMARY"
          df -h / | tail -1

      # Toda pieza que no esté corriendo y sana: su log y los NOMBRES de sus
      # variables de entorno — nunca los valores, aunque acá sean de usar y tirar.
      - name: Qué pasó, si algo falló
        if: failure()
        working-directory: /opt/synergos
        run: |
          docker compose --file compose.prod.yml --project-directory . ps -a || true
          for c in $(docker ps -a --format '{{.Names}}'); do
            estado="$(docker inspect --format '{{.State.Status}} {{if .State.Health}}{{.State.Health.Status}}{{else}}sin-chequeo{{end}}' "$c")"
            case "$estado" in "running healthy"|"running sin-chequeo") continue ;; esac
            echo "════ $c — $estado"
            docker logs --tail 60 "$c" 2>&1 || true
            echo "── sus variables (sólo nombres):"
            docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$c" | cut -d= -f1 | grep -v '^$' | sort | tr '\n' ' '
            echo
          done
          docker compose --file compose.prod.yml --project-directory . logs --tail 40 cms proxy || true
