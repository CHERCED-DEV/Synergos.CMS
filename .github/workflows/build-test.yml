name: Build + tests (.NET)

# El repo tenía tres workflows —uSync, paridad CSS y contratos— y ninguno
# compilaba la solución ni corría los 976 tests. O sea: el gate más básico
# faltaba, y los tres que existían sólo disparan por `paths`, así que un
# cambio puramente C# no encendía nada.
#
# Este corre SIEMPRE (sin filtro de paths): si algo no compila, se ve acá.

on:
  pull_request:
  push:
    branches:
      - main
      - master

# Un push encima cancela el run anterior de la misma rama — no tiene sentido
# gastar minutos verificando un commit que ya quedó atrás.
concurrency:
  group: build-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: dotnet build + test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # global.json pinea SDK 10.x (rollForward latestFeature). Hay DOS runtimes
      # desde la F2 de la ADR 0140: el backend, Servicios.Tests y Arquitectura.Tests
      # targetean net10.0, y el CMS y su suite (CMS.Tests) siguen en net8.0 por el
      # pin de Umbraco 13 (ADR 0001). Instalamos los dos: el 10 lo exige global.json
      # y el 8 trae el runtime en el que corre CMS.Tests.
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Synergos.CMS.sln

      - name: Build
        run: dotnet build Synergos.CMS.sln --no-restore --configuration Release

      - name: Test
        run: >-
          dotnet test Synergos.CMS.sln
          --no-build
          --configuration Release
          --logger "trx;LogFileName=test-results.trx"
          --results-directory ./TestResults

      # Un `dotnet build` verde NO dice que las vistas compilen: `ModelsMode=InMemoryAuto`
      # fuerza `RazorCompileOnBuild=false`, asi que las 401 se compilan en caliente, al
      # servirlas. Este paso las compila a proposito, en dos pasadas (~20 s): la segunda mira
      # el CUERPO, que la primera no puede ver (#184). Lo que caza —una vista en 500
      # permanente— no lo ve ninguno de los 3288 tests. Costo tres veces: #92 (diez dias con
      # toda pagina de contenido en 500), #157 y #184.
      #
      # Va DESPUES de los tests, y no por prioridad: hace `-t:Rebuild`, asi que puesto
      # arriba dejaria los binarios rehechos bajo los pies del `dotnet test --no-build`.
      #
      # Y va en ESTE workflow, que es el unico sin filtro de `paths`, tambien a proposito:
      # lo que rompe una vista puede ser la vista, un tipo que alguien borro en otra capa,
      # o una propiedad de MSBuild a tres carpetas de distancia (#157). Un filtro que
      # intentara enumerar eso se equivocaria en silencio, que es el #128.
      - name: Las vistas compilan
        run: node tools/compilan-las-vistas.mjs --configuration Release

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./TestResults
          if-no-files-found: warn
